# Simple workflow for deploying static content to GitHub Pages
name: Web UI (PROD)
run-name: Deploying web app from ${{ github.ref_name }} by @${{ github.actor }}

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"

env:
  NODE_VERSION: 20.x
  S3_BUCKET: s3://trgsoftware.net/
  CLOUDFRONT_DIST: E2P46EFOCH8OZ3

jobs:

  ##
  # Builds the React/Typescript app into a distributable build folder.
  #
  ##
  build-webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    # Run npm ci
    - name: CI
      run: npm ci
    # Run npm build
    - name: Build
      run: npm run build --if-present
    # Save the build artifacts
    - name: Save build artifacts
      uses: actions/upload-artifact@v2
      with:
        name: build-artifacts
        path: apps/ui/build
        retention-days: 1

  ##
  # Deploys the built front-end to S3 and invalidates the
  #
  ##
  deploy-webapp:
    name: "Deploy Manufacturing Web App"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    needs: build-webapp
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Download build artifacts
      uses: actions/download-artifact@v2
      with:
        name: build-artifacts
        path: apps/ui/build

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.x"

    - name: Install AWS CLI
      run: pip install awscli

    # e.g. aws s3 sync ./build s3://trg-mfg.snap.triple.engineering/ --acl=public-read --delete
    - name: Sync objects to S3 bucket
      run: aws s3 sync ./build ${{ env.S3_BUCKET }} --acl=public-read --delete

    # e.g. aws cloudfront create-invalidation --distribution-id E3TQAGO3NE2F83 --paths "/*"
    - name: Invalidate Cloudfront caches
      run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DIST }} --paths "/*"
